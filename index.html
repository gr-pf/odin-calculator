<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Odin-Calculator</title>
    <script type="module" src="./script.js"></script>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="wrapper">
      <main class="calculator">
        <div class="display">
          <h2>My calculator !</h2>
          <p class="formula">5+3</p>
          <p class="result">8</p>
        </div>
        <div class="key-grid">
          <ul class="key-row">
            <li><a href="">7</a></li>
            <li><a href="">8</a></li>
            <li><a href="">9</a></li>
            <li><a href="">/</a></li>
          </ul>

          <ul class="key-row">
            <li><a href="">4</a></li>
            <li><a href="">5</a></li>
            <li><a href="">6</a></li>
            <li><a href="">*</a></li>
          </ul>

          <ul class="key-row">
            <li><a href="">1</a></li>
            <li><a href="">2</a></li>
            <li><a href="">3</a></li>
            <li><a href="">-</a></li>
          </ul>

          <ul class="key-row">
            <li><a href="">+/-</a></li>
            <li><a href="">0</a></li>
            <li><a href="">.</a></li>
            <li><a href="">+</a></li>
          </ul>

          <ul class="key-row">
            <li><a href="">=</a></li>
            <li><a href="">clear</a></li>
          </ul>
        </div>
      </main>
    </div>
  </body>
</html>
