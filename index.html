<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Odin-Calculator</title>
    <script type="module" src="./script.js"></script>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="wrapper">
      <main class="calculator">
        <div class="display">
          <h2>My calculator !</h2>
          <p class="formula">5+3</p>
          <p class="result">8</p>
        </div>
        <div class="key-grid">
          <ul class="key-row">
            <li><a href="#" id="k-7">7</a></li>
            <li><a href="#" id="k-8">8</a></li>
            <li><a href="#" id="k-9">9</a></li>
            <li><a href="#" id="divide">/</a></li>
          </ul>

          <ul class="key-row">
            <li><a href="#" id="k-4">4</a></li>
            <li><a href="#" id="k-5">5</a></li>
            <li><a href="#" id="k-6">6</a></li>
            <li><a href="#" id="multiply">*</a></li>
          </ul>

          <ul class="key-row">
            <li><a href="#" id="k-1">1</a></li>
            <li><a href="#" id="k-2">2</a></li>
            <li><a href="#" id="k-3">3</a></li>
            <li><a href="#" id="subtract">-</a></li>
          </ul>

          <ul class="key-row">
            <li><a href="#" id="positivity">+/-</a></li>
            <li><a href="#" id="k-0">0</a></li>
            <li><a href="#" id="decimal-separator">.</a></li>
            <li><a href="#" id="add">+</a></li>
          </ul>

          <ul class="key-row">
            <li><a href="#" id="eval">=</a></li>
            <li><a href="#" id="clear">clear</a></li>
          </ul>
        </div>
      </main>
    </div>
  </body>
</html>
