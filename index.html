<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Odin-Calculator</title>
    <script type="module" src="./script.js"></script>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="wrapper">
      <main class="calculator">
        <div class="display">
          <h2>My calculator !</h2>
          <p class="formula">0</p>
          <p class="result">0</p>
        </div>
        <div class="key-grid">
          <ul class="key-row">
            <li><a href="#" id="k-7" class="operand">7</a></li>
            <li><a href="#" id="k-8" class="operand">8</a></li>
            <li><a href="#" id="k-9" class="operand">9</a></li>
            <li><a href="#" id="divide" class="operator">/</a></li>
          </ul>

          <ul class="key-row">
            <li><a href="#" id="k-4" class="operand">4</a></li>
            <li><a href="#" id="k-5" class="operand">5</a></li>
            <li><a href="#" id="k-6" class="operand">6</a></li>
            <li><a href="#" id="multiply" class="operator">*</a></li>
          </ul>

          <ul class="key-row">
            <li><a href="#" id="k-1" class="operand">1</a></li>
            <li><a href="#" id="k-2" class="operand">2</a></li>
            <li><a href="#" id="k-3" class="operand">3</a></li>
            <li><a href="#" id="subtract" class="operator">-</a></li>
          </ul>

          <ul class="key-row">
            <li><a href="#" id="positivity" class="operand">+/-</a></li>
            <li><a href="#" id="k-0" class="operand">0</a></li>
            <li><a href="#" id="decimal-separator" class="operand">.</a></li>
            <li><a href="#" id="add" class="operator">+</a></li>
          </ul>

          <ul class="key-row">
            <li><a href="#" id="eval" class="eval">=</a></li>
            <li><a href="#" id="clear" class="clear">clear</a></li>
          </ul>
        </div>
      </main>
    </div>
  </body>
</html>
