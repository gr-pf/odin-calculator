<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Odin-Calculator</title>
    <script type="module" src="./script.js"></script>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="wrapper">
      <main class="calculator">
        <div class="display">
          <p class="formula">5+3</p>
          <p class="result">8</p>
        </div>
        <div class="key-grid">
          <ul class="key-row">
            <li>7</li>
            <li>8</li>
            <li>9</li>
            <li>/</li>
          </ul>
        </div>
        <div class="key-grid">
          <ul class="key-row">
            <li>4</li>
            <li>5</li>
            <li>6</li>
            <li>*</li>
          </ul>
        </div>
        <div class="key-grid">
          <ul class="key-row">
            <li>1</li>
            <li>2</li>
            <li>3</li>
            <li>-</li>
          </ul>
        </div>
        <div class="key-grid">
          <ul class="key-row">
            <li>+/-</li>
            <li>0</li>
            <li>.</li>
            <li>+</li>
          </ul>
        </div>
        <div class="key-grid">
          <ul class="key-row">
            <li>=</li>
            <li>clear</li>
          </ul>
        </div>
      </main>
    </div>
  </body>
</html>
